<style>
	.~ID~ figure { border-top: 1px solid #E0E0E0; }
	.~ID~ figure .msg { padding: 20px; }
	.~ID~ figure:first-child { margin-top: 0; }
	.~ID~ figure .date { float: right; font-size: 11px; margin-top: 2px; color: #a0a0a0; }
	.~ID~ figure .edited { float: right; font-size: 11px; color: #C0C0C0; margin: 2px 0 0 8px; }
	.~ID~ figure .msg > .user { font-size: 11px; font-weight: bold; color: #555; }
	.~ID~ figure .msg > .user img { width: 20px; height: 20px; border-radius: 100px; margin-right: 5px; }
	.~ID~ figure .msg > .user span { color: #FFF !important; background-color: #E0E0E0; width: 20px; height: 20px; line-height: 21px; font-size: 8px; font-weight: bold; text-align: center; border-radius: 100px; margin-right: 5px; position: relative; display: inline-block; }
	.~ID~ figure .content { margin-top: 7px; }
	.~ID~ figure .control { float: right; margin-left: 10px; }
	.~ID~ figure.owner .msg { background-color: #FFFFF5; }
	.~ID~ .messages { display: block; }
	.~ID~ .markdown p { margin: 0 0 15px; padding-left: 0; padding-right: 0; font-size: 15px !important; color: #000; }
	.~ID~ .markdown { font-size: 15px; }
	.~ID~ .markdown pre { margin-top: 0; }
	.~ID~ .markdown-tasks > li { cursor: not-allowed; }
</style>

<ui-plugin path="CLASS" config="isolated:true" class="~ID~">
	<ui-bind path="?.messages" config="template:figure" class="messages">
		<script type="text/html">
			{{ foreach m in value }}
			<figure data-id="{{ m.id }}"{{ if m.me }} class="owner"{{ fi }}>
				<div class="msg">
					{{ if m.me }}
					<span class="control exec" data-exec="?/options"><i class="ti ti-ellipsis-h-circle"></i></span>
					{{ fi }}
					{{ if m.dtupdated }}<span class="edited hidden-xs">@(edited)</span>{{ fi }}
					<span class="date">{{ m.dtcreated | time2 }}</span>
					<div class="user">{{ if m.userphoto }}<img src="{{ m.userphoto }}" alt="" class="photo" />{{ fi }}{{ m.username }}</div>
					<div class="content">{{ m.markdown | markdown2 }}</div>
				</div>
				<div class="clearfix"></div>
			</figure>
			{{ end }}
		</script>
	</ui-bind>
	<div class="newcomment">
		<ui-component name="chatmessage" path="?.id" config="autoheight:1;send:?/send;button:@(Send);placeholder:@(Enter a comment);$assign:?|message" class="invisible"></ui-component>
	</div>
</ui-plugin>

<script>
	PLUGIN('CLASS', function(exports) {

		var ticketid = null;
		var caller;
		var box;

		exports.reload = function() {
			var model = exports.model;
			ticketid = model.id;
			exports.refresh();
		};

		exports.options = function(el) {
			var id = ATTRD(el);
			var opt = {};
			opt.element = el;
			opt.align ='right';
			opt.items = [];
			opt.items.push({ id: 'edit', name: '@(Edit)', icon: 'ti ti-pencil' });
			opt.items.push({ id: 'remove', name: '@(Remove)', icon: 'ti ti-remove red' });
			opt.callback = function(selected) {
				switch (selected.id) {
					case 'edit':

						var comment = exports.model.messages.findItem('id', id);
						exports.message.edit(comment.markdown, function(text) {
							exports.tapi('Comments|update ERROR', { id: id, markdown: text }, exports.refresh);
						});
						break;
					case 'remove':
						SETTER('approve/show', '@(Are you sure you want to remove selected comment?)', ':remove: @(Remove)', () => exports.tapi('Comments|remove ERROR', { id: id }, exports.refresh));
						break;
				}
			};
			SETTER('menu/show', opt);
		};

		exports.refresh = function() {
			var detail = exports.model;
			ticketid = detail.id;
			exports.tapi('Comments', { id: detail.id }, function(response) {
				for (var m of response)
					m.me = m.userid === user.id;
				exports.set('messages', response);
			});
		};

		exports.send = function(msg) {
			SETTER('sounds/play', 'badge');
			exports.tapi('Comments|create ERROR', msg, () => setTimeout(exports.message.edit, 200));
		};

		exports.on('message', function(msg) {
			if (msg.TYPE === 'comment' && msg.id === ticketid)
				exports.refresh();
		});

	});

</script>
